# Cloudflare settings for the convoy manifest save service (see README.md).
# Secrets (GITHUB_TOKEN, PASSCODES) are NOT here – add them in the Cloudflare dashboard.
# "name" must match the Worker's name in Cloudflare.
name = "cfo-convoys"
main = "convoy-worker.js"
compatibility_date = "2026-11-01"
workers_dev = true

[vars]
ALLOWED_ORIGIN = "https://myles-rowcliff.github.io"
REPO = "myles-rowcliff/CFO---VESSEL-ROAD---SCHEDULE"
